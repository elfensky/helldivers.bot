# Docker Swarm stack — helldivers.bot STAGING (the 3-Pi cluster).
#
# THIS FILE IS THE WRITER. It is Git-Synced into Arcane (stack `helldiversbot`,
# swarm environment), which polls this path and applies it — so the compose is
# read-only in the Arcane UI and rollback is `git revert`, not a console edit.
# Do not `docker stack deploy` this by hand once the Arcane project exists;
# that reintroduces the two-writers problem Git Sync is here to remove.
#
# This repo is PUBLIC. Nothing secret may enter this file — every credential is
# an external Swarm secret created out-of-band on a manager.
#
# Manual fallback (Arcane down):
#   docker stack deploy -c deploy/staging/compose.yaml helldiversbot
#
# Prereqs — external Swarm secrets, created once on a manager (see deploy/README.md):
#   helldiversbot_database_url    secret   Postgres connection string
#   helldiversbot_update_key      secret   API key for the update endpoint
#   helldiversbot_cloudflared     secret   Cloudflare Tunnel token (remotely-managed)
#
# Naming: <app>_<secret>. Swarm secrets are cluster-global and flat — there is
# no namespace — so as more stacks land on this cluster an unprefixed name like
# `postgres_url` is a collision waiting to happen. External secrets are NOT
# prefixed by the stack, so the prefix has to be in the name itself.
#
# Ingress is a Cloudflare Tunnel: cloudflared dials OUT to the Cloudflare edge,
# so there are NO published ports. It reaches the app at http://app:3000 over
# the `internal` overlay — Swarm's service VIP load-balances to whichever node
# holds a replica, so cloudflared never needs to know about node IPs.
#
# The tunnel is REMOTELY MANAGED: the token identifies it and the ingress rules
# (staging.helldivers.bot -> http://app:3000) live in the Cloudflare Zero Trust
# dashboard, not in this file. Routing changes are made there.
#
# Migrations are NOT a service here — Swarm ignores `depends_on`. Run the
# migrate image as a one-shot BEFORE deploying. It is amd64-only (prisma
# generate SIGILLs under QEMU arm64), so it cannot run on the Pis; run it
# from an amd64 host. See deploy/README.md.
#
# The `image:` line below is written by CI (bump-staging-tag in
# build-staging.yml): every green develop build pins `:sha-<commit>` here and
# commits, and that commit is what Git Sync redeploys on. A merge that
# carries a migration is NOT bumped automatically — migrate by hand, then pin
# the tag by hand. Rollback is `git revert` of the bump commit.

networks:
    internal:
        driver: overlay

secrets:
    helldiversbot_database_url:
        external: true
    helldiversbot_update_key:
        external: true
    helldiversbot_cloudflared:
        external: true

# One service, N replicas, exactly one poller: every replica runs the cron
# thread, but each poll must claim the lease row in worker_heartbeat first
# (src/update/lease.mjs, #517). Postgres serialises the claim, so one instance
# does the work and the rest answer "standby". A dead holder is replaced
# within the 60 s TTL with no election. The poller's state lives in the same
# row, so a handover neither misses nor duplicates a transition.
#
# Because of that, no placement constraint and no separate worker service:
# `docker service scale` is safe at any N.

services:
    app:
        # Rewritten by CI to :sha-<commit> — see the header.
        image: ghcr.io/elfensky/helldiversbot:sha-5ddb0fdf18d3a3f49e111086393c17427e4dc3d2
        networks: [internal]
        environment:
            NODE_ENV: production
            PORT: '3000'
            UPDATE_INTERVAL: '20'
            # Swarm expands this per task. Without it the SDK falls back to
            # os.hostname(), which in a container is the container ID — so the
            # server_name tag in GlitchTip changes on every redeploy instead of
            # naming the node the task landed on.
            SENTRY_SERVER_NAME: '{{.Node.Hostname}}-{{.Task.Slot}}'
            # The app reads secrets from files via the `*_FILE` convention
            # (src/shared/utils/hydrateFileSecrets.mjs): if POSTGRES_URL_FILE is set,
            # it populates POSTGRES_URL from that file before Prisma reads it.
            # Points at the STAGING database (db-staging on huginn,
            # 10.0.0.40:5433/helldiversbot_staging) — no longer the dev
            # instance on :5432. The secret is named *_database_url to match
            # the [appname]_[secretName] convention; the env var stays
            # POSTGRES_URL_FILE because that is what the app reads.
            POSTGRES_URL_FILE: /run/secrets/helldiversbot_database_url
            UPDATE_KEY_FILE: /run/secrets/helldiversbot_update_key
        secrets:
            - helldiversbot_database_url
            - helldiversbot_update_key
        # Auth is deliberately unconfigured: initializeEnv treats a missing
        # BETTER_AUTH_SECRET as "auth disabled" and warns. Add the auth vars
        # (and BETTER_AUTH_URL=https://staging.helldivers.bot) when the OAuth
        # apps have staging callback URLs registered.
        #
        # Healthcheck is baked into the image (GET /api/healthcheck -> 503 when the
        # DB is unreachable, 200 healthy), so start-first rollout gates on real health.
        # cloudflared reaches http://app:3000 — the service VIP — and Swarm
        # spreads NEW connections across every healthy replica (per TCP
        # connection, not per request; cloudflared pools keep-alives, so the
        # spread is lumpy). That IS the load balancing; nothing on the
        # Cloudflare side knows there are three.
        #
        # Soft spread, NOT `max_replicas_per_node: 1`: the hard cap plus
        # start-first never converges on a 3-node swarm — the replacement task
        # has no node, sits Pending, and Pending is not a failure so rollback
        # never fires (moby/moby#40797). The preference puts one per node when
        # three are up and doubles up on a live node when one is down.
        deploy:
            replicas: 3
            placement:
                preferences:
                    - spread: node.id
            update_config:
                order: start-first
                failure_action: rollback
                monitor: 30s
            rollback_config:
                order: start-first
            restart_policy:
                condition: any

    cloudflared:
        image: cloudflare/cloudflared:2026.8.2
        # The image's ENTRYPOINT is already `cloudflared --no-autoupdate`, so the
        # command is just the subcommand.
        command: tunnel run
        networks: [internal]
        environment:
            # TUNNEL_TOKEN has no *_FILE variant, but `tunnel run` accepts
            # --token-file / $TUNNEL_TOKEN_FILE, so the token stays a Swarm
            # secret and never lands in the service spec. This avoids an
            # entrypoint shim, which would not work anyway: the image is
            # distroless and has no /bin/sh.
            TUNNEL_TOKEN_FILE: /run/secrets/helldiversbot_cloudflared
        secrets:
            - helldiversbot_cloudflared
        # 2 replicas, no placement constraint. Every cloudflared running these
        # credentials registers as a connector on the same tunnel and Cloudflare
        # load-balances across them, so a node dying does not drop ingress.
        # (A `node.role == manager` constraint would be a no-op here — all three
        # nodes are managers.) They do not race for certs; Cloudflare owns TLS.
        deploy:
            replicas: 2
            restart_policy:
                condition: any
