# Docker Swarm stack — helldivers.bot STAGING (the 3-Pi cluster).
# Deployed by the `deploy-staging` job in .github/workflows/staging.docker.yml.
#
# ⚠️  DRAFT / UNTESTED. This cannot run until the swarm + a self-hosted runner
#     exist. Open integration points are listed in deploy/README.md — do not
#     treat this as verified.
#
# Design (see the vault handbook: work-drunik/infrastructure):
#   - Ingress is Cloudflare Tunnel. cloudflared dials OUT to the CF edge, so
#     there are NO published ports. It reaches the app at http://app:3000 over
#     the `internal` overlay.
#   - Migrations are NOT a service here — Swarm ignores `depends_on`. They run
#     as a one-shot BEFORE `docker stack deploy` (see the deploy job).
#   - Secrets are external Swarm secrets, mounted as files at /run/secrets/*.

networks:
    internal:
        driver: overlay

secrets:
    staging_postgres_url:
        external: true
    staging_update_key:
        external: true
    staging_cf_tunnel_token:
        external: true

services:
    app:
        image: ghcr.io/elfensky/helldiversbot:staging
        networks: [internal]
        environment:
            NODE_ENV: production
            PORT: '3000'
            UPDATE_INTERVAL: '20'
            # TODO(secrets): the app reads POSTGRES_URL / UPDATE_KEY from process.env,
            # but Swarm secrets are FILES at /run/secrets/*. Resolve one of:
            #   (a) add `*_FILE` support in the app (if POSTGRES_URL_FILE is set, read it), or
            #   (b) an entrypoint shim that exports the secret files into env before `node server.js`.
            # The (a) convention is wired below and is the smaller change:
            POSTGRES_URL_FILE: /run/secrets/staging_postgres_url
            UPDATE_KEY_FILE: /run/secrets/staging_update_key
        secrets:
            - staging_postgres_url
            - staging_update_key
        # Healthcheck is baked into the image (GET /api/healthcheck -> 503 when the
        # DB is unreachable, 200 healthy), so start-first rollout gates on real health.
        deploy:
            replicas: 1
            update_config:
                order: start-first
                failure_action: rollback
                monitor: 30s
            rollback_config:
                order: start-first
            restart_policy:
                condition: any

    cloudflared:
        # TODO(tunnel): pin to a current tag before first deploy.
        image: cloudflare/cloudflared:2026.3.0
        # TODO(tunnel): cloudflared reads its token from the TUNNEL_TOKEN env var,
        # which does NOT have a *_FILE variant. Two real options:
        #   (a) entrypoint shim: `sh -c 'cloudflared tunnel run --token "$(cat /run/secrets/staging_cf_tunnel_token)"'`
        #   (b) credentials-file mode: mount the tunnel creds.json as the secret and
        #       add a Swarm `config` config.yml with the ingress rules:
        #           ingress:
        #             - hostname: staging.helldivers.bot
        #               service: http://app:3000
        #             - service: http_status:404
        # Placeholder command — replace once the tunnel is created (see deploy/README.md):
        command:
            [
                'sh',
                '-c',
                'cloudflared tunnel --no-autoupdate run --token "$(cat /run/secrets/staging_cf_tunnel_token)"',
            ]
        networks: [internal]
        secrets:
            - staging_cf_tunnel_token
        deploy:
            replicas: 1
            placement:
                # 1 replica, pinned to a manager. cloudflared replicas don't race on
                # certs (CF owns TLS), so scaling later is safe if you want HA.
                constraints: [node.role == manager]
            restart_policy:
                condition: any
