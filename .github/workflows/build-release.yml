name: 'Build: Release'

on:
    push:
        tags:
            - 'v*.*.*' # Triggers on version tags like v1.0.0

# Never cancel a half-published release. Two tags pushed back to back queue
# rather than racing each other to the `production` and `latest` floating tags.
concurrency:
    group: build-release-${{ github.ref_name }}
    cancel-in-progress: false

# Read-only by default; the two jobs that need to write say so themselves.
permissions:
    contents: read

jobs:
    # The same gate CI runs, against the exact tagged commit.
    #
    # main's branch protection already requires the "Test & Build" check to
    # merge, so the code in a release has normally passed. "Normally" is the
    # problem: a tag can be pushed at ANY commit — an older one, a hotfix
    # merged with admin override, a hand-moved tag — and check-ci.yml does not
    # run on tags at all, so nothing re-checks what is actually being shipped.
    # This job makes the tag itself the unit that gets verified.
    #
    # Shares the sequence with check-ci.yml through a COMPOSITE action rather
    # than a `workflow_call` reusable workflow. A reusable workflow would rename
    # the check from "Test & Build" to "<caller> / Test & Build", and main's
    # required status check matches on that exact string — every PR to main
    # would block forever waiting for a check that no longer reports. A
    # composite action runs inside this job, so the name is untouched.
    verify:
        name: Test & Build
        runs-on: ubuntu-latest
        timeout-minutes: 25

        steps:
            - name: Checkout code
              uses: actions/checkout@v7.0.1

            - name: Lint, typecheck, test and build
              uses: ./.github/actions/verify

    build-app:
        name: Build App Image
        needs: verify
        runs-on: ubuntu-latest
        # arm64 builds under QEMU emulation are slow; 30 leaves headroom.
        timeout-minutes: 30
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v7.0.1

            - name: Build and push APP
              uses: ./.github/actions/docker-publish
              with:
                  file: ./Dockerfile.app
                  platforms: linux/amd64,linux/arm64
                  registry-token: ${{ secrets.GITHUB_TOKEN }}
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/helldiversbot:${{ github.ref_name }}
                      ghcr.io/${{ github.repository_owner }}/helldiversbot:production
                      ghcr.io/${{ github.repository_owner }}/helldiversbot:latest
                  build-args: |
                      NODE_ENV=production
                      NEXT_PUBLIC_DEPLOY_ENV=production
                      NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
                  # Sentry credentials go in build-secrets, NOT build-args —
                  # build-args land in the provenance attestation pushed to
                  # GHCR, where anyone with pull access can read them. See #284.
                  build-secrets: |
                      sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
                      sentry_url=${{ vars.SENTRY_URL }}
                      sentry_org=${{ secrets.SENTRY_ORG }}
                      sentry_project=${{ secrets.SENTRY_PROJECT }}

    # Always build migrate in Production — unlike staging, no skip logic here.
    # Each tag needs a versioned image, releases are infrequent (~$3/yr CI cost),
    # and a missing migration image causes broken deploys. Not worth optimizing.
    build-migrate:
        name: Build Migrate Image
        needs: verify
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v7.0.1

            - name: Build and push MIGRATE
              uses: ./.github/actions/docker-publish
              with:
                  file: ./Dockerfile.migrate
                  registry-token: ${{ secrets.GITHUB_TOKEN }}
                  # amd64 only — NOT an oversight. `prisma generate` dies under
                  # QEMU aarch64 emulation with `qemu: uncaught target signal 4
                  # (Illegal instruction)`, exit 132: Prisma's engine binary uses
                  # instructions QEMU doesn't implement. The amd64 leg of the same
                  # build succeeds. Adding arm64 here (8b5b2058, two hours after
                  # v0.67.1 was tagged) was speculative prep for the Pi swarm and
                  # broke the first release that tried it — v0.90.4, where the app
                  # image published fine and this one failed, leaving no migrate
                  # image for the tag.
                  #
                  # The app image (Dockerfile.app) still builds both arches; only
                  # Prisma is affected. To restore arm64 here, the QEMU problem has
                  # to be solved first — newer binfmt (`docker/setup-qemu-action`
                  # with `image: tonistiigi/binfmt:latest`) or a native arm64
                  # runner — and verified on a real tag, not assumed.
                  platforms: linux/amd64
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/helldiversbot-migrate:${{ github.ref_name }}
                      ghcr.io/${{ github.repository_owner }}/helldiversbot-migrate:production
                      ghcr.io/${{ github.repository_owner }}/helldiversbot-migrate:latest
                  build-args: |
                      NODE_ENV=production

    github-release:
        name: Create GitHub Release
        needs: [build-app, build-migrate]
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write # creates the GitHub Release for the tag

        steps:
            - name: Checkout code
              uses: actions/checkout@v7.0.1

            - name: Extract changelog for this version
              id: changelog
              env:
                  TAG_NAME: ${{ github.ref_name }}
              run: |
                  VERSION="${TAG_NAME#v}"
                  # State-machine awk: find "## <version>" header, collect until next "## " header or EOF
                  awk -v ver="$VERSION" '
                    /^## / { if (found) exit; if (index($0, "## " ver) == 1) { found=1; next } }
                    found { print }
                  ' CHANGELOG.md > /tmp/release-notes.md

                  # Fail if changelog section is missing or empty
                  if [ ! -s /tmp/release-notes.md ] || [ -z "$(tr -d '[:space:]' < /tmp/release-notes.md)" ]; then
                    echo "::warning::No changelog entry found for ${VERSION} — using tag name as release body"
                    echo "Release ${TAG_NAME}" > /tmp/release-notes.md
                  fi

                  # Append Docker image references
                  OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
                  {
                    echo ""
                    echo "---"
                    echo ""
                    echo "### Docker Images"
                    echo ""
                    echo '```'
                    echo "docker pull ghcr.io/${OWNER}/helldiversbot:${TAG_NAME}"
                    echo "docker pull ghcr.io/${OWNER}/helldiversbot-migrate:${TAG_NAME}"
                    echo '```'
                  } >> /tmp/release-notes.md

            - name: Create GitHub Release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG_NAME: ${{ github.ref_name }}
              run: |
                  gh release create "$TAG_NAME" \
                    --title "$TAG_NAME" \
                    --notes-file /tmp/release-notes.md
