name: Staging
on:
    workflow_dispatch: # allows requesting workflow manually from the website
    push:
        branches:
            - main
permissions:
    contents: write
    packages: write

jobs:
    detect-migration:
        runs-on: ubuntu-latest
        outputs:
            migrate: ${{ steps.filter.outputs.migrate }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Detect migration-related changes
              id: filter
              uses: dorny/paths-filter@v4
              with:
                  filters: |
                      migrate:
                        - 'prisma/**'
                        - 'prisma.config.mjs'
                        - 'package.json'
                        - 'package-lock.json'
                        - 'Dockerfile.migrate'

    build-migrate:
        needs: detect-migration
        if: needs.detect-migration.outputs.migrate == 'true' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push MIGRATE
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ./Dockerfile.migrate
                  push: true
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/helldiversbot-migrate:staging
                  build-args: |
                      NODE_ENV=staging
    build-app:
        # needs: sonarqube # <--- This makes build wait for sonarqube to finish
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push APP
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ./Dockerfile.app
                  #   platforms: linux/amd64,linux/arm64
                  push: true
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/helldiversbot:staging
                  build-args: |
                      NODE_ENV=staging

    cleanup:
        needs: [build-migrate, build-app]
        if: ${{ !cancelled() }} # Run even when build-migrate is skipped
        runs-on: ubuntu-latest
        steps:
            - name: Cleanup untagged packages
              uses: snok/container-retention-policy@v3.0.1
              with:
                  account: user
                  token: ${{ secrets.GITHUB_TOKEN }}
                  image-names: 'helldiversbot helldiversbot-migrate'
                  tag-selection: untagged
                  cut-off: 30min
                  dry-run: false
