name: Build Develop
on:
    workflow_dispatch:
        inputs: {}
    push:
        branches:
            - develop
permissions:
    contents: write
    packages: write

jobs:
    detect-migration:
        runs-on: ubuntu-latest
        outputs:
            migrate: ${{ steps.filter.outputs.migrate }}
            image_missing: ${{ steps.check.outputs.missing }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v6.0.3

            - name: Detect migration-related changes
              id: filter
              uses: dorny/paths-filter@v4.0.1
              with:
                  filters: |
                      migrate:
                        - 'prisma/**'
                        - 'prisma.config.mjs'
                        - 'package.json'
                        - 'package-lock.json'
                        - 'Dockerfile.migrate'

            - name: Check if migrate image exists
              id: check
              run: |
                  if docker manifest inspect ghcr.io/${{ github.repository_owner }}/helldiversbot-migrate:staging > /dev/null 2>&1; then
                    echo "missing=false" >> "$GITHUB_OUTPUT"
                  else
                    echo "missing=true" >> "$GITHUB_OUTPUT"
                  fi

    build-migrate:
        needs: detect-migration
        if: needs.detect-migration.outputs.migrate == 'true' || needs.detect-migration.outputs.image_missing == 'true' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6.0.3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4.1.0

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v4.2.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push MIGRATE
              uses: docker/build-push-action@v7.2.0
              with:
                  context: .
                  file: ./Dockerfile.migrate
                  push: true
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/helldiversbot-migrate:staging
                  build-args: |
                      NODE_ENV=production
    build-app:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6.0.3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4.1.0

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v4.2.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push APP
              uses: docker/build-push-action@v7.2.0
              with:
                  context: .
                  file: ./Dockerfile.app
                  #   platforms: linux/amd64,linux/arm64
                  push: true
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/helldiversbot:staging
                  build-args: |
                      NODE_ENV=production
                      NEXT_PUBLIC_DEPLOY_ENV=staging
                  # Sentry credentials are passed as BuildKit secrets, NOT
                  # build-args. Build-args end up in the image's provenance
                  # attestation that gets pushed to GHCR — anyone with pull
                  # access can extract them. Secrets are tmpfs-only inside
                  # the build RUN and never persisted. See #284.
                  secrets: |
                      sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
                      sentry_url=${{ secrets.SENTRY_URL }}
                      sentry_org=${{ secrets.SENTRY_ORG }}
                      sentry_project=${{ secrets.SENTRY_PROJECT }}

    cleanup:
        needs: [build-migrate, build-app]
        if: ${{ !cancelled() }} # Run even when build-migrate is skipped
        runs-on: ubuntu-latest
        steps:
            - name: Cleanup untagged packages
              uses: snok/container-retention-policy@v3.1.0
              with:
                  account: user
                  token: ${{ secrets.GITHUB_TOKEN }}
                  image-names: 'helldiversbot'
                  tag-selection: untagged
                  cut-off: 30min
                  dry-run: false
