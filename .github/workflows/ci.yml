name: CI

on:
    pull_request:
        branches: [main, develop]
    push:
        branches: [main, develop]

permissions:
    contents: read

jobs:
    test:
        name: Test & Build
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.node-version'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Check formatting
              run: npx prettier --check .

            - name: Run unit tests
              run: npm run test:unit

            - name: Build
              run: npm run build
              env:
                  # Stub required build-time env vars so Next.js build succeeds in CI
                  POSTGRES_URL: 'postgresql://ci:ci@localhost:5432/ci'
                  AUTH_SECRET: 'ci-secret'
