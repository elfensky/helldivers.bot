name: CI

on:
    pull_request:
        branches: [main, develop]
    push:
        branches: [main, develop]

concurrency:
    group: ci-${{ github.event.pull_request.number || github.sha }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    test:
        name: Test & Build
        runs-on: ubuntu-latest

        # Backing store for the smoke gate at the end of this job. Nothing before
        # the "Apply migrations" step touches it — in particular the Build step
        # keeps its unreachable stub URL (localhost:5432), which is why this maps
        # to 5433 instead of the default port: the build's behaviour stays exactly
        # what it is today rather than silently acquiring a live database.
        services:
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_USER: ci
                    POSTGRES_PASSWORD: ci
                    POSTGRES_DB: ci
                ports:
                    - 5433:5432
                options: >-
                    --health-cmd "pg_isready -U ci -d ci"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10

        env:
            # Connection string for every smoke-gate step (NOT the build — see above).
            SMOKE_POSTGRES_URL: 'postgresql://ci:ci@localhost:5433/ci'
            #
            # The deterministic API key for the key-gated /api/v1/h1/* smoke
            # assertions is deliberately NOT declared at job level. It is split
            # across the only two steps that need it, so the separation holds at
            # runtime rather than merely on paper:
            #   - "Seed the database"  gets SEED_TEST_API_KEY_HASH (digest only)
            #   - "Run smoke tests"    gets SEED_TEST_API_KEY (plaintext, for the
            #     `Authorization: Bearer <key>` header)
            # The seed therefore never has the plaintext in its environment at all,
            # and never hashes anything.
            #
            # NOT A SECRET. A throwaway CI-only test credential, checked in
            # deliberately as a plain constant rather than a repository secret — it
            # grants access to nothing but this job's Postgres service container,
            # created and destroyed with the runner. It MUST NEVER be used anywhere
            # else: not in a developer database, not in staging, not in production.
            # seed.mjs creates the ApiKey row only when the _HASH var is set, so no
            # developer or production seed run ever produces a key.

        steps:
            - name: Checkout code
              uses: actions/checkout@v7.0.0

            - name: Setup Node.js
              uses: actions/setup-node@v6.4.0
              with:
                  node-version-file: '.node-version'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            # The Prisma client (src/generated/prisma/, gitignored) is imported by
            # src/db/db.js, so it must exist before typecheck, unit tests, and build.
            # Generate it right after install — not after the gates.
            - name: Generate Prisma client
              run: npx prisma generate
              env:
                  POSTGRES_URL: 'postgresql://ci:ci@localhost:5432/ci'

            - name: Lint
              run: npm run lint

            - name: Typecheck
              run: npm run typecheck

            - name: Run unit tests
              run: npm run test:unit

            - name: Build
              run: npm run build
              env:
                  # Stub the eagerly-validated server config (config/server.mjs runs
                  # parseServerConfig() at import) so `next build` page-data collection
                  # succeeds. These three are the required vars; auth is left unset
                  # (auth-off at build) to avoid the all-or-none provider check.
                  POSTGRES_URL: 'postgresql://ci:ci@localhost:5432/ci'
                  UPDATE_KEY: 'ci-stub-key'
                  UPDATE_INTERVAL: '20'

            # ─── Smoke gate ─────────────────────────────────────────────
            #
            # Everything above proves the app compiles. Everything below proves it
            # BOOTS: the build that `npm run build` just produced is assembled,
            # started against a migrated + seeded database, and answered against by
            # the smoke suite. Reusing that build is the whole point — a separate
            # `needs:` job would have to redo `npm ci` + `npm run build` (or ship
            # `.next` through the artifact store) and would still be serialised
            # behind this one, so ordered steps are both simpler and faster. The
            # fast feedback loop is unaffected: lint/typecheck/unit still run first
            # and still abort the job on failure without waiting for a boot.
            #
            # This gate is deliberately NOT a replacement for
            # main-pr-docker-smoke.yml — see the note at the top of that file.

            # The cron worker spawns on boot and immediately polls the official HD1
            # API through /api/h1/update, which would write live season rows into
            # the database mid-test and make the gate depend on a third party being
            # up. Pinning the domain to a dead address makes that first poll fail
            # fast, so the database stays exactly as seeded and the gate is
            # hermetic. Reaching the real HD1 API is not this job's assertion.
            - name: Blackhole the official HD1 API
              run: echo '0.0.0.0 api.helldiversgame.com' | sudo tee -a /etc/hosts

            - name: Apply migrations
              run: npx prisma migrate deploy
              env:
                  POSTGRES_URL: ${{ env.SMOKE_POSTGRES_URL }}

            # Fully offline: seed.mjs reads the ~156 season fixtures committed under
            # prisma/seed/seasons/ and makes no network call. Seeding is required,
            # not cosmetic — /archives renders a "unable to load" fallback instead
            # of the text the smoke suite asserts when getCampaign() finds no rows.
            # SEED_TEST_API_KEY_HASH additionally creates the v1 API key + owner row
            # (from the digest alone — the seed never sees the plaintext key).
            - name: Seed the database
              run: node prisma/seed/seed.mjs
              env:
                  POSTGRES_URL: ${{ env.SMOKE_POSTGRES_URL }}
                  # sha-256 hex of the plaintext key used by the smoke step below.
                  # Non-secret, CI-only, throwaway. Never use elsewhere. Regenerate
                  # both together:
                  #   printf 'ci-smoke-test-key-do-not-use-elsewhere' | shasum -a 256
                  SEED_TEST_API_KEY_HASH: 'f419d915c0daa5ac45543eb22fda2cd2b7030f26e69b3cc2e7850885aa34bb56'

            # next.config.mjs sets output:'standalone', so `next start` does not
            # work. The script locates .next/standalone/**/server.js, copies in the
            # .next/static and public/ trees that next build leaves out (exactly as
            # Dockerfile.app does), boots it, and blocks until /api/healthcheck
            # returns 200 — failing loudly with the server log if it never does.
            - name: Boot the built app
              run: scripts/start-standalone.sh
              env:
                  PORT: '3000'
                  POSTGRES_URL: ${{ env.SMOKE_POSTGRES_URL }}
                  NODE_ENV: production
                  UPDATE_KEY: 'ci-smoke-stub-key'
                  # One poll fires immediately on boot regardless; a long interval
                  # means it is also the only one. It fails anyway (see the
                  # /etc/hosts pin above).
                  UPDATE_INTERVAL: '3600'

            - name: Run smoke tests against the built app
              run: npm run test:smoke
              env:
                  TEST_SERVER_URL: http://127.0.0.1:3000
                  # Plaintext of the digest seeded above. Non-secret, CI-only,
                  # throwaway. Unsetting it makes the v1 assertions skip.
                  SEED_TEST_API_KEY: 'ci-smoke-test-key-do-not-use-elsewhere'
                  # SMOKE_ALLOW_SKIP is deliberately unset: an unreachable server
                  # must fail this job, never skip it.

            - name: Dump the server log on failure
              if: failure()
              run: cat .next/standalone-server.log || true

            - name: Stop the server
              if: always()
              run: kill "$(cat .next/standalone-server.pid)" 2>/dev/null || true
