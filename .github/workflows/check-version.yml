name: 'Check: Version Bump'

# A release PR into main must raise the version (AGENTS.md § This repo's own
# rules, "The version cut"). PRs into develop raise none, so they skip this.
on:
    pull_request:
        branches: [main]
        # Anything whose change ships to users. `pyproject.toml` used to be
        # listed here — there is no Python in this repo, so it never matched.
        paths: ['src/**', 'prisma/**', 'public/**', 'package.json']

concurrency:
    group: check-version-${{ github.event.pull_request.number || github.sha }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    bumped:
        name: Version Bump
        # Dependabot PRs get the version bump pushed onto their branch by hand,
        # not by the bot, so this gate would only ever block the bot's own push.
        if: github.actor != 'dependabot[bot]'
        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
            - name: Checkout code
              uses: actions/checkout@v7.0.1
              with:
                  # Full history: the base branch ref has to be resolvable.
                  fetch-depth: 0

            - name: Version must differ from the base branch
              run: |
                  base="origin/${{ github.base_ref }}"
                  old=$(git show "$base:package.json" | jq -r .version)
                  new=$(jq -r .version package.json)
                  [ "$old" != "$new" ] || { echo "::error::Still $new — bump it"; exit 1; }
