name: Production

on:
    push:
        tags:
            - 'v*.*.*' # Triggers on version tags like v1.0.0

permissions:
    contents: write
    packages: write

jobs:
    build-app:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ./Dockerfile.app
                  # platforms: linux/amd64,linux/arm64
                  push: true
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/helldiversbot:${{ github.ref_name }}
                      ghcr.io/${{ github.repository_owner }}/helldiversbot:production
                      ghcr.io/${{ github.repository_owner }}/helldiversbot:latest
                  build-args: |
                      NODE_ENV=production

    build-migrate:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push MIGRATE image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ./Dockerfile.migrate
                  push: true
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/helldiversbot-migrate:${{ github.ref_name }}
                      ghcr.io/${{ github.repository_owner }}/helldiversbot-migrate:production
                      ghcr.io/${{ github.repository_owner }}/helldiversbot-migrate:latest
                  build-args: |
                      NODE_ENV=production

    github-release:
        needs: [build-app, build-migrate]
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Extract changelog for this version
              id: changelog
              env:
                  TAG_NAME: ${{ github.ref_name }}
              run: |
                  VERSION="${TAG_NAME#v}"
                  # Extract the section for this version from CHANGELOG.md
                  NOTES=$(awk "/^## ${VERSION}[[:space:]]/,/^## [0-9]/" CHANGELOG.md | sed '$ d')
                  # Remove the version header line itself
                  NOTES=$(echo "$NOTES" | tail -n +2)
                  # Write to file to preserve multiline
                  echo "$NOTES" > /tmp/release-notes.md

            - name: Create GitHub Release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG_NAME: ${{ github.ref_name }}
              run: |
                  gh release create "$TAG_NAME" \
                    --title "$TAG_NAME" \
                    --notes-file /tmp/release-notes.md
