name: Build Production

on:
    push:
        tags:
            - "v*.*.*" # Triggers on version tags like v1.0.0

permissions:
    contents: write
    packages: write

jobs:
    build-app:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push Docker image
              uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
              with:
                  context: .
                  file: ./Dockerfile.app
                  # platforms: linux/amd64,linux/arm64
                  push: true
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/helldiversbot:${{ github.ref_name }}
                      ghcr.io/${{ github.repository_owner }}/helldiversbot:production
                      ghcr.io/${{ github.repository_owner }}/helldiversbot:latest
                  build-args: |
                      NODE_ENV=production

    # Always build migrate in Production — unlike staging, no skip logic here.
    # Each tag needs a versioned image, releases are infrequent (~$3/yr CI cost),
    # and a missing migration image causes broken deploys. Not worth optimizing.
    build-migrate:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push MIGRATE image
              uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
              with:
                  context: .
                  file: ./Dockerfile.migrate
                  push: true
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/helldiversbot-migrate:${{ github.ref_name }}
                      ghcr.io/${{ github.repository_owner }}/helldiversbot-migrate:production
                      ghcr.io/${{ github.repository_owner }}/helldiversbot-migrate:latest
                  build-args: |
                      NODE_ENV=production

    github-release:
        needs: [build-app, build-migrate]
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

            - name: Extract changelog for this version
              id: changelog
              env:
                  TAG_NAME: ${{ github.ref_name }}
              run: |
                  VERSION="${TAG_NAME#v}"
                  # State-machine awk: find "## <version>" header, collect until next "## " header or EOF
                  awk -v ver="$VERSION" '
                    /^## / { if (found) exit; if (index($0, "## " ver) == 1) { found=1; next } }
                    found { print }
                  ' CHANGELOG.md > /tmp/release-notes.md

                  # Fail if changelog section is missing or empty
                  if [ ! -s /tmp/release-notes.md ] || [ -z "$(tr -d '[:space:]' < /tmp/release-notes.md)" ]; then
                    echo "::warning::No changelog entry found for ${VERSION} — using tag name as release body"
                    echo "Release ${TAG_NAME}" > /tmp/release-notes.md
                  fi

                  # Append Docker image references
                  OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
                  {
                    echo ""
                    echo "---"
                    echo ""
                    echo "### Docker Images"
                    echo ""
                    echo '```'
                    echo "docker pull ghcr.io/${OWNER}/helldiversbot:${TAG_NAME}"
                    echo "docker pull ghcr.io/${OWNER}/helldiversbot-migrate:${TAG_NAME}"
                    echo '```'
                  } >> /tmp/release-notes.md

            - name: Create GitHub Release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG_NAME: ${{ github.ref_name }}
              run: |
                  gh release create "$TAG_NAME" \
                    --title "$TAG_NAME" \
                    --notes-file /tmp/release-notes.md
