name: Build Production

on:
    push:
        tags:
            - 'v*.*.*' # Triggers on version tags like v1.0.0

permissions:
    contents: write
    packages: write

jobs:
    # The same gate CI runs, against the exact tagged commit.
    #
    # main's branch protection already requires the "Test & Build" check to
    # merge, so the code in a release has normally passed. "Normally" is the
    # problem: a tag can be pushed at ANY commit — an older one, a hotfix
    # merged with admin override, a hand-moved tag — and ci.yml does not run on
    # tags at all, so nothing re-checks what is actually being shipped. This
    # job makes the tag itself the unit that gets verified.
    #
    # Deliberately duplicated from ci.yml rather than extracted into a
    # `workflow_call` reusable workflow: that would rename ci.yml's check from
    # "Test & Build" to "<caller> / Test & Build", and main's required status
    # check matches on that exact string. Every PR to main would then block
    # forever waiting for a check that no longer reports. ~25 duplicated lines
    # on a workflow that runs a few times a year is the cheaper mistake.
    verify:
        name: Test & Build
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v7.0.1

            - name: Setup Node.js
              uses: actions/setup-node@v7.0.0
              with:
                  node-version-file: '.node-version'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            # src/db/db.js imports the generated Prisma client (gitignored), so
            # it has to exist before typecheck, tests and build.
            - name: Generate Prisma client
              run: npx prisma generate
              env:
                  POSTGRES_URL: 'postgresql://ci:ci@localhost:5432/ci'

            - name: Lint
              run: npm run lint

            - name: Typecheck
              run: npm run typecheck

            - name: Run unit tests
              run: npm run test:unit

            - name: Build
              run: npm run build
              env:
                  # Stubs for the eagerly-validated server config — see ci.yml.
                  POSTGRES_URL: 'postgresql://ci:ci@localhost:5432/ci'
                  UPDATE_KEY: 'ci-stub-key'
                  UPDATE_INTERVAL: '20'

    build-app:
        needs: verify
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v7.0.1

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v4.2.0

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4.2.0

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v7.3.0
              with:
                  context: .
                  file: ./Dockerfile.app
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/helldiversbot:${{ github.ref_name }}
                      ghcr.io/${{ github.repository_owner }}/helldiversbot:production
                      ghcr.io/${{ github.repository_owner }}/helldiversbot:latest
                  build-args: |
                      NODE_ENV=production
                      NEXT_PUBLIC_DEPLOY_ENV=production
                      NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
                  # Sentry credentials are passed as BuildKit secrets, NOT
                  # build-args. Build-args end up in the image's provenance
                  # attestation that gets pushed to GHCR — anyone with pull
                  # access can extract them. Secrets are tmpfs-only inside
                  # the build RUN and never persisted. See #284.
                  secrets: |
                      sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
                      sentry_url=${{ vars.SENTRY_URL }}
                      sentry_org=${{ secrets.SENTRY_ORG }}
                      sentry_project=${{ secrets.SENTRY_PROJECT }}

    # Always build migrate in Production — unlike staging, no skip logic here.
    # Each tag needs a versioned image, releases are infrequent (~$3/yr CI cost),
    # and a missing migration image causes broken deploys. Not worth optimizing.
    build-migrate:
        needs: verify
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v7.0.1

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v4.2.0

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4.2.0

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push MIGRATE image
              uses: docker/build-push-action@v7.3.0
              with:
                  context: .
                  file: ./Dockerfile.migrate
                  # amd64 only — NOT an oversight. `prisma generate` dies under
                  # QEMU aarch64 emulation with `qemu: uncaught target signal 4
                  # (Illegal instruction)`, exit 132: Prisma's engine binary uses
                  # instructions QEMU doesn't implement. The amd64 leg of the same
                  # build succeeds. Adding arm64 here (8b5b2058, two hours after
                  # v0.67.1 was tagged) was speculative prep for the Pi swarm and
                  # broke the first release that tried it — v0.90.4, where the app
                  # image published fine and this one failed, leaving no migrate
                  # image for the tag.
                  #
                  # The app image (Dockerfile.app) still builds both arches; only
                  # Prisma is affected. To restore arm64 here, the QEMU problem has
                  # to be solved first — newer binfmt (`docker/setup-qemu-action`
                  # with `image: tonistiigi/binfmt:latest`) or a native arm64
                  # runner — and verified on a real tag, not assumed.
                  platforms: linux/amd64
                  push: true
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/helldiversbot-migrate:${{ github.ref_name }}
                      ghcr.io/${{ github.repository_owner }}/helldiversbot-migrate:production
                      ghcr.io/${{ github.repository_owner }}/helldiversbot-migrate:latest
                  build-args: |
                      NODE_ENV=production

    github-release:
        needs: [build-app, build-migrate]
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v7.0.1

            - name: Extract changelog for this version
              id: changelog
              env:
                  TAG_NAME: ${{ github.ref_name }}
              run: |
                  VERSION="${TAG_NAME#v}"
                  # State-machine awk: find "## <version>" header, collect until next "## " header or EOF
                  awk -v ver="$VERSION" '
                    /^## / { if (found) exit; if (index($0, "## " ver) == 1) { found=1; next } }
                    found { print }
                  ' CHANGELOG.md > /tmp/release-notes.md

                  # Fail if changelog section is missing or empty
                  if [ ! -s /tmp/release-notes.md ] || [ -z "$(tr -d '[:space:]' < /tmp/release-notes.md)" ]; then
                    echo "::warning::No changelog entry found for ${VERSION} — using tag name as release body"
                    echo "Release ${TAG_NAME}" > /tmp/release-notes.md
                  fi

                  # Append Docker image references
                  OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
                  {
                    echo ""
                    echo "---"
                    echo ""
                    echo "### Docker Images"
                    echo ""
                    echo '```'
                    echo "docker pull ghcr.io/${OWNER}/helldiversbot:${TAG_NAME}"
                    echo "docker pull ghcr.io/${OWNER}/helldiversbot-migrate:${TAG_NAME}"
                    echo '```'
                  } >> /tmp/release-notes.md

            - name: Create GitHub Release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG_NAME: ${{ github.ref_name }}
              run: |
                  gh release create "$TAG_NAME" \
                    --title "$TAG_NAME" \
                    --notes-file /tmp/release-notes.md
