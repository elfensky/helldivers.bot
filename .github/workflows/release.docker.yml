name: Build Production

on:
    push:
        tags:
            - 'v*.*.*' # Triggers on version tags like v1.0.0

permissions:
    contents: write
    packages: write

jobs:
    build-app:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v7.0.0

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4.1.0

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v4.2.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v7.2.0
              with:
                  context: .
                  file: ./Dockerfile.app
                  # platforms: linux/amd64,linux/arm64
                  push: true
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/helldiversbot:${{ github.ref_name }}
                      ghcr.io/${{ github.repository_owner }}/helldiversbot:production
                      ghcr.io/${{ github.repository_owner }}/helldiversbot:latest
                  build-args: |
                      NODE_ENV=production
                      NEXT_PUBLIC_DEPLOY_ENV=production
                  # Sentry credentials are passed as BuildKit secrets, NOT
                  # build-args. Build-args end up in the image's provenance
                  # attestation that gets pushed to GHCR — anyone with pull
                  # access can extract them. Secrets are tmpfs-only inside
                  # the build RUN and never persisted. See #284.
                  secrets: |
                      sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
                      sentry_url=${{ secrets.SENTRY_URL }}
                      sentry_org=${{ secrets.SENTRY_ORG }}
                      sentry_project=${{ secrets.SENTRY_PROJECT }}

    # Always build migrate in Production — unlike staging, no skip logic here.
    # Each tag needs a versioned image, releases are infrequent (~$3/yr CI cost),
    # and a missing migration image causes broken deploys. Not worth optimizing.
    build-migrate:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v7.0.0

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4.1.0

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v4.2.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push MIGRATE image
              uses: docker/build-push-action@v7.2.0
              with:
                  context: .
                  file: ./Dockerfile.migrate
                  push: true
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/helldiversbot-migrate:${{ github.ref_name }}
                      ghcr.io/${{ github.repository_owner }}/helldiversbot-migrate:production
                      ghcr.io/${{ github.repository_owner }}/helldiversbot-migrate:latest
                  build-args: |
                      NODE_ENV=production

    github-release:
        needs: [build-app, build-migrate]
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v7.0.0

            - name: Extract changelog for this version
              id: changelog
              env:
                  TAG_NAME: ${{ github.ref_name }}
              run: |
                  VERSION="${TAG_NAME#v}"
                  # State-machine awk: find "## <version>" header, collect until next "## " header or EOF
                  awk -v ver="$VERSION" '
                    /^## / { if (found) exit; if (index($0, "## " ver) == 1) { found=1; next } }
                    found { print }
                  ' CHANGELOG.md > /tmp/release-notes.md

                  # Fail if changelog section is missing or empty
                  if [ ! -s /tmp/release-notes.md ] || [ -z "$(tr -d '[:space:]' < /tmp/release-notes.md)" ]; then
                    echo "::warning::No changelog entry found for ${VERSION} — using tag name as release body"
                    echo "Release ${TAG_NAME}" > /tmp/release-notes.md
                  fi

                  # Append Docker image references
                  OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
                  {
                    echo ""
                    echo "---"
                    echo ""
                    echo "### Docker Images"
                    echo ""
                    echo '```'
                    echo "docker pull ghcr.io/${OWNER}/helldiversbot:${TAG_NAME}"
                    echo "docker pull ghcr.io/${OWNER}/helldiversbot-migrate:${TAG_NAME}"
                    echo '```'
                  } >> /tmp/release-notes.md

            - name: Create GitHub Release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG_NAME: ${{ github.ref_name }}
              run: |
                  gh release create "$TAG_NAME" \
                    --title "$TAG_NAME" \
                    --notes-file /tmp/release-notes.md
