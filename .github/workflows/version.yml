name: version
on:
  pull_request:
    branches: [develop, main]
    paths: ['src/**', 'package.json', 'pyproject.toml']

jobs:
  bumped:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with: { fetch-depth: 0 }
      - name: Version must differ from the base branch
        run: |
          base="origin/${{ github.base_ref }}"
          old=$(git show "$base:package.json" | jq -r .version)
          new=$(jq -r .version package.json)
          [ "$old" != "$new" ] || { echo "::error::Still $new — bump it"; exit 1; }
