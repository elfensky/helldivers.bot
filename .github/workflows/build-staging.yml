name: 'Build: Staging'
# Gated on CI, not on the push itself. Both used to trigger on
# `push: branches: [develop]`, which meant they raced: the image built,
# published and deployed while lint/typecheck/tests were still running, so a
# red CI was a note attached to an already-shipped build. develop takes direct
# merges without a PR (see CLAUDE.md § Git Workflow), so the PR check that
# guards main never applies here — this is the only gate.
#
# `workflow_run` resolves this file from the DEFAULT branch (develop), so edits
# take effect once merged there, not from a feature branch.
on:
    workflow_dispatch:
        inputs: {}
    workflow_run:
        # Matches check-ci.yml's `name:`, NOT its filename. The two move
        # together or this trigger silently stops firing.
        workflows: ['Check: CI']
        types: [completed]
        branches: [develop]

# Never cancel: deploy-staging runs `docker stack deploy` against a live swarm,
# and killing that mid-flight leaves the stack half-converged. A second merge
# to develop queues behind the first instead.
concurrency:
    group: build-staging
    cancel-in-progress: false

# Read-only by default; the jobs that touch GHCR say so themselves. This used
# to grant `contents: write` workflow-wide — nothing here writes contents.
permissions:
    contents: read

env:
    # The commit CI actually tested — NOT the branch tip, which may have moved
    # on. Falls back to github.sha for workflow_dispatch, where there is no
    # workflow_run payload. Every checkout below uses this.
    TESTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
    detect-migration:
        name: Detect Migration Changes
        # CI green, or a deliberate manual run. Anything else stops here.
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
        runs-on: ubuntu-latest
        timeout-minutes: 10
        outputs:
            migrate: ${{ steps.filter.outputs.migrate }}
            image_missing: ${{ steps.check.outputs.missing }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v7.0.1
              with:
                  ref: ${{ env.TESTED_SHA }}
                  fetch-depth: 2

            # HEAD^ is the first parent, so on a --no-ff merge this spans
            # everything the branch brought in — the shape every merge to
            # develop takes. A push of several loose commits would only compare
            # the last one; the image_missing check below and a manual
            # workflow_dispatch both force a build if that ever bites.
            - name: Detect migration-related changes
              id: filter
              run: |
                  if git diff --name-only HEAD^ HEAD \
                     | grep -qE '^(prisma/|prisma\.config\.mjs|package(-lock)?\.json|Dockerfile\.migrate)'; then
                    echo "migrate=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "migrate=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Check if migrate image exists
              id: check
              run: |
                  if docker manifest inspect ghcr.io/${{ github.repository_owner }}/helldiversbot-migrate:staging > /dev/null 2>&1; then
                    echo "missing=false" >> "$GITHUB_OUTPUT"
                  else
                    echo "missing=true" >> "$GITHUB_OUTPUT"
                  fi

    build-migrate:
        name: Build Migrate Image
        needs: detect-migration
        if: needs.detect-migration.outputs.migrate == 'true' || needs.detect-migration.outputs.image_missing == 'true' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
            packages: write
        steps:
            - name: Checkout code
              uses: actions/checkout@v7.0.1
              with:
                  ref: ${{ env.TESTED_SHA }}

            - name: Build and push MIGRATE
              uses: ./.github/actions/docker-publish
              with:
                  file: ./Dockerfile.migrate
                  registry-token: ${{ secrets.GITHUB_TOKEN }}
                  # amd64 only — see the matching comment in build-release.yml.
                  # `prisma generate` SIGILLs under QEMU aarch64 (exit 132).
                  platforms: linux/amd64
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/helldiversbot-migrate:staging
                  build-args: |
                      NODE_ENV=production

    build-app:
        name: Build App Image
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
        runs-on: ubuntu-latest
        # arm64 builds under QEMU emulation are slow; 30 leaves headroom.
        timeout-minutes: 30
        permissions:
            contents: read
            packages: write
        steps:
            - name: Checkout code
              uses: actions/checkout@v7.0.1
              with:
                  ref: ${{ env.TESTED_SHA }}

            - name: Build and push APP
              uses: ./.github/actions/docker-publish
              with:
                  file: ./Dockerfile.app
                  platforms: linux/amd64,linux/arm64
                  registry-token: ${{ secrets.GITHUB_TOKEN }}
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/helldiversbot:staging
                  build-args: |
                      NODE_ENV=production
                      NEXT_PUBLIC_DEPLOY_ENV=staging
                      NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
                  # Sentry credentials go in build-secrets, NOT build-args —
                  # build-args land in the provenance attestation pushed to
                  # GHCR, where anyone with pull access can read them. See #284.
                  build-secrets: |
                      sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
                      sentry_url=${{ vars.SENTRY_URL }}
                      sentry_org=${{ secrets.SENTRY_ORG }}
                      sentry_project=${{ secrets.SENTRY_PROJECT }}

    # ⚠️ DRAFT / UNTESTED until a self-hosted runner exists on a Pi swarm manager.
    # GitHub's cloud runners cannot reach the home-LAN cluster; this job runs on
    # the runner installed there. See deploy/README.md for the open TODOs.
    deploy-staging:
        name: Deploy to Staging
        needs: [build-app, build-migrate]
        # DORMANT until the swarm + self-hosted runner exist. Flip repo variable
        # STAGING_DEPLOY_ENABLED=true to activate (without it the job skips cleanly
        # instead of hanging "pending" waiting for a runner that isn't there).
        # Runs even when build-migrate was skipped — the existing :staging migrate
        # image is reused. Skips if the app build failed.
        if: ${{ !cancelled() && needs.build-app.result == 'success' && vars.STAGING_DEPLOY_ENABLED == 'true' }}
        runs-on: self-hosted
        # The convergence wait alone can take 5 minutes (30 × 10s).
        timeout-minutes: 20
        permissions:
            contents: read
            packages: read # docker pull from GHCR
        steps:
            - name: Checkout code
              uses: actions/checkout@v7.0.1
              with:
                  ref: ${{ env.TESTED_SHA }}

            - name: Log in to GHCR
              run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            - name: Maintenance banner ON (optional — skipped if Kuma unset)
              if: ${{ vars.KUMA_URL != '' }}
              run: |
                  npm i socket.io-client@4 --no-save --silent
                  node .github/scripts/kuma-maintenance.mjs start
              env:
                  KUMA_URL: ${{ vars.KUMA_URL }}
                  KUMA_USERNAME: ${{ secrets.KUMA_USERNAME }}
                  KUMA_PASSWORD: ${{ secrets.KUMA_PASSWORD }}
                  KUMA_MONITOR_IDS: ${{ vars.KUMA_STAGING_MONITOR_IDS }}

            - name: Run migrations (one-shot, before the stack)
              run: |
                  docker pull ghcr.io/${{ github.repository_owner }}/helldiversbot-migrate:staging
                  docker run --rm \
                    -e POSTGRES_URL="${{ secrets.STAGING_POSTGRES_URL }}" \
                    -e FORCE_SEED="${{ vars.FORCE_SEED }}" \
                    ghcr.io/${{ github.repository_owner }}/helldiversbot-migrate:staging

            - name: Deploy the stack
              run: |
                  docker pull ghcr.io/${{ github.repository_owner }}/helldiversbot:staging
                  docker stack deploy --with-registry-auth -c deploy/stack.staging.yml helldivers

            - name: Wait for the app service to converge (healthy)
              run: |
                  for i in $(seq 1 30); do
                    reps=$(docker service ls --filter name=helldivers_app --format '{{.Replicas}}')
                    echo "helldivers_app: ${reps:-pending}"
                    [ "$reps" = "1/1" ] && exit 0
                    sleep 10
                  done
                  echo "::error::app service did not converge"; docker service ps helldivers_app --no-trunc; exit 1

            - name: Maintenance banner OFF (always)
              if: ${{ always() && vars.KUMA_URL != '' }}
              run: |
                  npm i socket.io-client@4 --no-save --silent
                  node .github/scripts/kuma-maintenance.mjs end
              env:
                  KUMA_URL: ${{ vars.KUMA_URL }}
                  KUMA_USERNAME: ${{ secrets.KUMA_USERNAME }}
                  KUMA_PASSWORD: ${{ secrets.KUMA_PASSWORD }}

    cleanup:
        name: Cleanup Untagged Images
        needs: [build-migrate, build-app]
        # Runs when build-migrate is skipped (nothing to rebuild), but not
        # when build-app is skipped — that means CI failed and nothing was
        # published to prune.
        if: ${{ !cancelled() && needs.build-app.result != 'skipped' }}
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Cleanup untagged packages
              uses: snok/container-retention-policy@v3.1.0
              with:
                  account: user
                  # Classic PAT with delete:packages — the default GITHUB_TOKEN
                  # (ghs_) is rejected by container-retention-policy and can't
                  # delete user-account packages.
                  token: ${{ secrets.GHCR_CLEANUP_TOKEN }}
                  # SPACE-separated (the action's own documented syntax:
                  # `image-names: "foo bar baz"`). Both packages are republished
                  # on every staging build, so both orphan untagged blobs —
                  # helldiversbot-migrate was missing here and its blobs
                  # accumulated indefinitely.
                  image-names: 'helldiversbot helldiversbot-migrate'
                  tag-selection: untagged
                  cut-off: 30min
                  dry-run: false
