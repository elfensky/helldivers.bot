name: 'Build: Staging'
# Gated on CI, not on the push itself. Both used to trigger on
# `push: branches: [develop]`, which meant they raced: the image built,
# published and deployed while lint/typecheck/tests were still running, so a
# red CI was a note attached to an already-shipped build. develop takes PRs
# rebase-merged (see AGENTS.md § Worktrees) but has no required checks, so the
# check that guards main never applies here — this is the only gate.
#
# `workflow_run` resolves this file from the DEFAULT branch (develop), so edits
# take effect once merged there, not from a feature branch.
on:
    workflow_dispatch:
    workflow_run:
        # Matches check-ci.yml's `name:`, NOT its filename. The two move
        # together or this trigger silently stops firing.
        workflows: ['Check: CI']
        types: [completed]
        branches: [develop]

# Never cancel: bump-staging-tag force-pushes deploy/staging, and two runs
# racing on that push would pin whichever lost. A second merge to develop
# queues behind the first instead.
concurrency:
    group: build-staging
    cancel-in-progress: false

# Read-only by default; the jobs that touch GHCR say so themselves, and only
# bump-staging-tag gets `contents: write`.
permissions:
    contents: read

env:
    # The commit CI actually tested — NOT the branch tip, which may have moved
    # on. Falls back to github.sha for workflow_dispatch, where there is no
    # workflow_run payload. Every checkout below uses this.
    TESTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
    detect-migration:
        name: Detect Migration Changes
        # CI green, or a deliberate manual run. Anything else stops here.
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
        runs-on: ubuntu-latest
        timeout-minutes: 10
        outputs:
            migrate: ${{ steps.filter.outputs.migrate }}
            image_missing: ${{ steps.check.outputs.missing }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v7.0.1
              with:
                  ref: ${{ env.TESTED_SHA }}
                  fetch-depth: 0

            # One question: does the migrate image need a rebuild? The diff
            # runs against what staging RUNS: the sha-<commit> pinned in
            # deploy/staging/compose.yaml on the deploy/staging branch (the
            # branch Git Sync watches; develop's copy of the image: line is not
            # what runs), falling back to the tested commit's copy until that
            # branch exists. It is not HEAD^..HEAD: under rebase merges that is
            # only the PR's last commit, the version bump. The pin spans every
            # commit since the last deploy, whatever the merge method. Pin
            # unreadable or not in history: rebuild the migrate image.
            # `migrate` = anything that changes what the migrate image contains
            # (package.json included). It never gates the staging pin: the app
            # applies its own migrations on start (#599).
            - name: Detect migration-related changes
              id: filter
              run: |
                  if git rev-parse -q --verify refs/remotes/origin/deploy/staging > /dev/null; then
                    compose=$(git show origin/deploy/staging:deploy/staging/compose.yaml)
                  else
                    compose=$(cat deploy/staging/compose.yaml)
                  fi
                  deployed=$(sed -nE 's#^[[:space:]]*image: ghcr\.io/[^/]+/helldiversbot:sha-([0-9a-f]{40}).*#\1#p' <<< "$compose" | head -n 1)
                  if [ -z "$deployed" ] || ! git merge-base --is-ancestor "$deployed" HEAD 2>/dev/null; then
                    echo "::warning title=staging base unknown::no pinned sha-<commit> on deploy/staging that is an ancestor of ${TESTED_SHA} — rebuilding the migrate image (the build is still pinned)"
                    echo "migrate=true" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  changed=$(git diff --name-only "$deployed" HEAD)
                  echo "Deployed ${deployed:0:12}; changed since:"; echo "$changed"
                  # Here-strings and one awk, no pipes: under the runner's
                  # `bash -eo pipefail`, a `grep -q` mid-pipe can SIGPIPE the
                  # writer and turn a match into a failure.
                  if grep -qE '^(prisma/|prisma\.config\.mjs|package(-lock)?\.json|Dockerfile\.migrate)' <<< "$changed"; then
                    echo "migrate=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "migrate=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Check if migrate image exists
              id: check
              run: |
                  if docker manifest inspect ghcr.io/${{ github.repository_owner }}/helldiversbot-migrate:staging > /dev/null 2>&1; then
                    echo "missing=false" >> "$GITHUB_OUTPUT"
                  else
                    echo "missing=true" >> "$GITHUB_OUTPUT"
                  fi

    # One leg per arch, each on a runner of that arch — never QEMU: Prisma's
    # engine SIGILLs under emulated aarch64 (see build-release.yml). Each leg
    # pushes :staging-<arch>; merge-migrate joins them into :staging, so the
    # Pis (arm64) and any amd64 host pull the same tag.
    build-migrate:
        name: Build Migrate Image (${{ matrix.arch }})
        needs: detect-migration
        if: needs.detect-migration.outputs.migrate == 'true' || needs.detect-migration.outputs.image_missing == 'true' || github.event_name == 'workflow_dispatch'
        strategy:
            matrix:
                include:
                    - arch: amd64
                      runner: ubuntu-latest
                    - arch: arm64
                      runner: ubuntu-24.04-arm
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 30
        permissions:
            contents: read
            packages: write
        steps:
            - name: Checkout code
              uses: actions/checkout@v7.0.1
              with:
                  ref: ${{ env.TESTED_SHA }}

            - name: Build and push MIGRATE
              uses: ./.github/actions/docker-publish
              with:
                  file: ./Dockerfile.migrate
                  registry-token: ${{ secrets.GITHUB_TOKEN }}
                  platforms: linux/${{ matrix.arch }}
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/helldiversbot-migrate:staging-${{ matrix.arch }}
                  build-args: |
                      NODE_ENV=production

    merge-migrate:
        name: Publish Migrate Manifest
        needs: build-migrate
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
            packages: write
        steps:
            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Join the two arches into :staging
              env:
                  IMAGE: ghcr.io/${{ github.repository_owner }}/helldiversbot-migrate
              run: |
                  docker buildx imagetools create -t "$IMAGE:staging" "$IMAGE:staging-amd64" "$IMAGE:staging-arm64"
                  out=$(docker buildx imagetools inspect "$IMAGE:staging")
                  echo "$out"
                  for p in linux/amd64 linux/arm64; do
                    grep -qE "Platform: +$p$" <<< "$out" || { echo "::error::$IMAGE:staging has no $p manifest"; exit 1; }
                  done

    # Same shape as build-migrate: one leg per arch, each on a runner of that
    # arch — never QEMU. On Node 26, `prisma generate` under emulated aarch64
    # fails with "Unable to parse JSON … [Context: getDmmf]" (run 40131915205,
    # 0.95.9); Node 24 survived it. Each leg pushes :staging-<arch>; merge-app
    # joins them into :staging and :sha-<commit>.
    build-app:
        name: Build App Image (${{ matrix.arch }})
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
        strategy:
            matrix:
                include:
                    - arch: amd64
                      runner: ubuntu-latest
                    - arch: arm64
                      runner: ubuntu-24.04-arm
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 30
        permissions:
            contents: read
            packages: write
        steps:
            - name: Checkout code
              uses: actions/checkout@v7.0.1
              with:
                  ref: ${{ env.TESTED_SHA }}

            - name: Build and push APP
              uses: ./.github/actions/docker-publish
              with:
                  file: ./Dockerfile.app
                  platforms: linux/${{ matrix.arch }}
                  registry-token: ${{ secrets.GITHUB_TOKEN }}
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/helldiversbot:staging-${{ matrix.arch }}
                  build-args: |
                      NODE_ENV=production
                      NEXT_PUBLIC_DEPLOY_ENV=staging
                      NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
                      NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
                  # Sentry credentials go in build-secrets, NOT build-args —
                  # build-args land in the provenance attestation pushed to
                  # GHCR, where anyone with pull access can read them. See #284.
                  build-secrets: |
                      sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
                      sentry_url=${{ vars.SENTRY_URL }}
                      sentry_org=${{ secrets.SENTRY_ORG }}
                      sentry_project=${{ secrets.SENTRY_PROJECT }}

    merge-app:
        name: Publish App Manifest
        needs: build-app
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
            packages: write
        steps:
            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Join the two arches into :staging and :sha-<commit>
              env:
                  IMAGE: ghcr.io/${{ github.repository_owner }}/helldiversbot
              run: |
                  docker buildx imagetools create -t "$IMAGE:staging" -t "$IMAGE:sha-$TESTED_SHA" "$IMAGE:staging-amd64" "$IMAGE:staging-arm64"
                  out=$(docker buildx imagetools inspect "$IMAGE:sha-$TESTED_SHA")
                  echo "$out"
                  for p in linux/amd64 linux/arm64; do
                    grep -qE "Platform: +$p$" <<< "$out" || { echo "::error::$IMAGE:sha-$TESTED_SHA has no $p manifest"; exit 1; }
                  done

    # The deploy itself is Arcane Git Sync (deploy/README.md): Arcane polls
    # the CI-owned branch deploy/staging and redeploys the stack when its
    # commit changes. A rebuilt floating `:staging` tag is invisible to it, so
    # this job writes the immutable tag into the tested commit's compose and
    # force-pushes that as deploy/staging. develop stays PR-only: CI never
    # pushes to it (descent-app's pattern, vault arcane-deploy § Path B).
    #
    # GITHUB_TOKEN pushes never trigger workflows (GitHub's recursion guard),
    # `[skip ci]` is belt and braces. Rollback: re-run this job in the earlier
    # run that deployed the good version (`gh run rerun <run> --job <job>`) —
    # it pins that run's tested commit again.
    #
    # No migration gate: every new task applies pending migrations, and the
    # seed when its data changed, before it serves (src/update/migrateOnStart.mjs,
    # #599), and start-first keeps the old tasks serving until then.
    bump-staging-tag:
        name: Bump Staging Tag
        needs: [merge-app]
        if: ${{ !cancelled() && needs.merge-app.result == 'success' }}
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: write
        steps:
            - name: Checkout the tested commit
              uses: actions/checkout@v7.0.1
              with:
                  ref: ${{ env.TESTED_SHA }}

            - name: Pin the tested image and push deploy/staging
              run: |
                  sed -i -E "s#^([[:space:]]*image: ghcr\.io/[^/]+/helldiversbot:).*#\1sha-${TESTED_SHA}#" deploy/staging/compose.yaml
                  git config user.name github-actions[bot]
                  git config user.email 41898282+github-actions[bot]@users.noreply.github.com
                  git commit -qam "chore(deploy): staging → sha-${TESTED_SHA:0:12} [skip ci]" || echo "compose already pins sha-${TESTED_SHA:0:12}"
                  git push --force origin HEAD:refs/heads/deploy/staging

    cleanup:
        name: Cleanup Untagged Images
        needs: [build-migrate, merge-migrate, build-app, merge-app]
        # Runs when build-migrate is skipped (nothing to rebuild), but not
        # when build-app is skipped — that means CI failed and nothing was
        # published to prune.
        if: ${{ !cancelled() && needs.build-app.result != 'skipped' }}
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Cleanup untagged packages
              uses: snok/container-retention-policy@v3.1.0
              with:
                  account: user
                  # Classic PAT with delete:packages — the default GITHUB_TOKEN
                  # (ghs_) is rejected by container-retention-policy and can't
                  # delete user-account packages.
                  token: ${{ secrets.GHCR_CLEANUP_TOKEN }}
                  # SPACE-separated (the action's own documented syntax:
                  # `image-names: "foo bar baz"`). Both packages are republished
                  # on every staging build, so both orphan untagged blobs —
                  # helldiversbot-migrate was missing here and its blobs
                  # accumulated indefinitely.
                  image-names: 'helldiversbot helldiversbot-migrate'
                  tag-selection: untagged
                  cut-off: 30min
                  dry-run: false
