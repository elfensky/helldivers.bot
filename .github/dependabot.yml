# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
    - package-ecosystem: 'npm'
      directory: '/'
      target-branch: 'develop'
      schedule:
          interval: 'weekly'
          day: 'monday'
          time: '09:00'
          timezone: 'Europe/Brussels'

      # Reduce PR noise by grouping updates
      groups:
          # The vitest packages pin each other exactly, so a lone bump fails `npm ci` (#558, #561-#563)
          vitest:
              patterns:
                  - 'vitest'
                  - '@vitest/*'
          # Group all minor/patch updates into a single PR
          minor-and-patch:
              patterns:
                  - '*'
              update-types:
                  - 'minor'
                  - 'patch'

      ignore:
          # @types/node stays on ^24 to match the Node 24 runtime (commit a78e9d68)
          - dependency-name: '@types/node'
            update-types:
                - 'version-update:semver-major'
          # TypeScript 7 fails `npm run typecheck` with 268 JSDoc errors; remove when #555 is done
          - dependency-name: 'typescript'
            update-types:
                - 'version-update:semver-major'

      # Limit open PRs to avoid overwhelming
      open-pull-requests-limit: 10

      # Add labels for filtering
      labels:
          - 'dependencies'
          - 'npm'

      # Customize commit messages
      commit-message:
          prefix: 'chore(deps)'

    # Keep GitHub Actions up to date
    - package-ecosystem: 'github-actions'
      directory: '/'
      target-branch: 'develop'
      schedule:
          interval: 'weekly'
          day: 'monday'
          time: '09:00'
          timezone: 'Europe/Brussels'
      groups:
          actions:
              patterns:
                  - '*'
      labels:
          - 'dependencies'
          - 'github-actions'
      commit-message:
          prefix: 'chore(deps)'
