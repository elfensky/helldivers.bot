sonar.projectKey=elfensky_helldiversbot
sonar.organization=elfensky
sonar.host.url=https://sonarcloud.io

# Source
sonar.sources=src
sonar.tests=src/__tests__
sonar.test.inclusions=src/__tests__/**/*.{test,spec}.{js,jsx,mjs}

# Exclusions (mirrors vitest.config.mjs coverage.exclude)
sonar.exclusions=src/generated/**,public/**,src/components/layout/DataFlowDiagram/**,src/db/db.js

# Coverage (produced by vitest v8 provider in CI)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# New code baseline — compare against main, not 9-month-old "previous version"
sonar.newCode.referenceBranch=main
