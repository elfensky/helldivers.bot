<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Helldivers Bot — Data Flow Architecture</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
                background: #0a0a0f;
                color: #e0e0e0;
                min-height: 100vh;
                overflow-x: hidden;
            }

            header {
                padding: 24px 32px 16px;
                border-bottom: 1px solid #1a1a2e;
                display: flex;
                align-items: center;
                gap: 16px;
            }
            header h1 {
                font-size: 20px;
                font-weight: 600;
                color: #fff;
            }
            header span {
                font-size: 13px;
                color: #666;
            }

            .controls {
                display: flex;
                gap: 8px;
                padding: 16px 32px;
                border-bottom: 1px solid #1a1a2e;
                flex-wrap: wrap;
            }
            .controls button {
                padding: 8px 16px;
                border: 1px solid #2a2a3e;
                border-radius: 6px;
                background: #12121f;
                color: #aaa;
                font-size: 13px;
                cursor: pointer;
                transition: all 0.2s;
            }
            .controls button:hover {
                border-color: #4a4a6e;
                color: #fff;
            }
            .controls button.active {
                border-color: #f59e0b;
                color: #f59e0b;
                background: #f59e0b15;
            }

            .canvas {
                padding: 32px;
                min-height: calc(100vh - 120px);
                position: relative;
            }

            svg.flow {
                width: 100%;
                height: 580px;
                display: block;
            }

            .node rect,
            .node-pill rect {
                rx: 8;
                ry: 8;
                transition: all 0.3s;
            }
            .node text,
            .node-pill text {
                font-family:
                    -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
                fill: #e0e0e0;
            }

            .cat-api rect {
                fill: #1e293b;
                stroke: #3b82f6;
                stroke-width: 1.5;
            }
            .cat-api text.label {
                fill: #60a5fa;
            }
            .cat-worker rect {
                fill: #1a1a2e;
                stroke: #a855f7;
                stroke-width: 1.5;
            }
            .cat-worker text.label {
                fill: #c084fc;
            }
            .cat-raw rect {
                fill: #1c1917;
                stroke: #f59e0b;
                stroke-width: 1.5;
            }
            .cat-raw text.label {
                fill: #fbbf24;
            }
            .cat-norm rect {
                fill: #0f1a0f;
                stroke: #22c55e;
                stroke-width: 1.5;
            }
            .cat-norm text.label {
                fill: #4ade80;
            }
            .cat-seed rect {
                fill: #1a1520;
                stroke: #ec4899;
                stroke-width: 1.5;
            }
            .cat-seed text.label {
                fill: #f472b6;
            }
            .cat-frontend rect {
                fill: #0f1520;
                stroke: #06b6d4;
                stroke-width: 1.5;
            }
            .cat-frontend text.label {
                fill: #22d3ee;
            }

            .arrow {
                stroke-width: 1.5;
                fill: none;
                marker-end: url(#arrowhead);
            }
            .arrow-api {
                stroke: #3b82f6;
            }
            .arrow-worker {
                stroke: #a855f7;
            }
            .arrow-amber {
                stroke: #f59e0b;
            }
            .arrow-green {
                stroke: #22c55e;
            }
            .arrow-seed {
                stroke: #ec4899;
            }
            .arrow-frontend {
                stroke: #06b6d4;
            }
            .arrow-dashed {
                stroke-dasharray: 6 4;
            }

            .dimmed {
                opacity: 0.12;
                transition: opacity 0.3s;
            }
            .highlighted {
                opacity: 1;
                transition: opacity 0.3s;
            }

            .annotation {
                font-family:
                    -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
                font-size: 11px;
                fill: #666;
            }
            .annotation-bg {
                fill: #0a0a0f;
            }

            .legend {
                position: fixed;
                bottom: 24px;
                right: 24px;
                background: #12121f;
                border: 1px solid #2a2a3e;
                border-radius: 8px;
                padding: 16px;
                font-size: 12px;
                z-index: 10;
            }
            .legend h3 {
                font-size: 13px;
                color: #888;
                margin-bottom: 8px;
                font-weight: 500;
            }
            .legend-item {
                display: flex;
                align-items: center;
                gap: 8px;
                margin: 4px 0;
            }
            .legend-dot {
                width: 10px;
                height: 10px;
                border-radius: 3px;
            }

            .detail-panel {
                position: fixed;
                top: 0;
                right: -420px;
                width: 400px;
                height: 100vh;
                background: #12121f;
                border-left: 1px solid #2a2a3e;
                padding: 24px;
                overflow-y: auto;
                transition: right 0.3s ease;
                z-index: 20;
            }
            .detail-panel.open {
                right: 0;
            }
            .detail-panel h2 {
                font-size: 16px;
                color: #fff;
                margin-bottom: 4px;
            }
            .detail-panel .subtitle {
                font-size: 12px;
                color: #666;
                margin-bottom: 16px;
            }
            .detail-panel .close {
                position: absolute;
                top: 16px;
                right: 16px;
                background: none;
                border: none;
                color: #666;
                font-size: 18px;
                cursor: pointer;
            }
            .detail-panel .close:hover {
                color: #fff;
            }
            .detail-panel pre {
                background: #0a0a0f;
                border: 1px solid #1a1a2e;
                border-radius: 6px;
                padding: 12px;
                font-size: 12px;
                font-family: 'SF Mono', 'Fira Code', monospace;
                color: #a0a0c0;
                overflow-x: auto;
                white-space: pre;
                margin: 8px 0;
            }
            .detail-panel p {
                font-size: 13px;
                color: #aaa;
                line-height: 1.6;
                margin: 8px 0;
            }
            .detail-panel .tag {
                display: inline-block;
                padding: 2px 8px;
                border-radius: 4px;
                font-size: 11px;
                font-weight: 500;
                margin: 2px;
            }
            .tag-interval {
                background: #a855f720;
                color: #c084fc;
            }
            .tag-upsert {
                background: #22c55e20;
                color: #4ade80;
            }
            .tag-once {
                background: #ec489920;
                color: #f472b6;
            }
            .tag-read {
                background: #06b6d420;
                color: #22d3ee;
            }

            .schema-table {
                width: 100%;
                border-collapse: collapse;
                margin: 8px 0;
            }
            .schema-table th {
                text-align: left;
                font-size: 11px;
                color: #666;
                padding: 4px 8px;
                border-bottom: 1px solid #1a1a2e;
            }
            .schema-table td {
                font-size: 12px;
                padding: 4px 8px;
                color: #aaa;
                font-family: 'SF Mono', monospace;
            }
            .schema-table tr:nth-child(even) td {
                background: #0a0a0f40;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Helldivers Bot — Data Flow</h1>
            <span>v1 Architecture</span>
        </header>

        <div class="controls">
            <button class="active" data-view="all">All Flows</button>
            <button data-view="live">Live Polling (5-15s)</button>
            <button data-view="snapshot">Snapshot Sync</button>
            <button data-view="seed">Seed (Bootstrap)</button>
            <button data-view="refresh">Force Refresh (Season)</button>
            <button data-view="read">Frontend Reads</button>
        </div>

        <div class="canvas">
            <svg class="flow" viewBox="0 0 1100 560">
                <defs>
                    <marker
                        id="arrowhead"
                        markerWidth="8"
                        markerHeight="6"
                        refX="8"
                        refY="3"
                        orient="auto"
                    >
                        <polygon points="0 0, 8 3, 0 6" fill="#666" />
                    </marker>
                    <marker
                        id="ah-blue"
                        markerWidth="8"
                        markerHeight="6"
                        refX="8"
                        refY="3"
                        orient="auto"
                    >
                        <polygon points="0 0, 8 3, 0 6" fill="#3b82f6" />
                    </marker>
                    <marker
                        id="ah-amber"
                        markerWidth="8"
                        markerHeight="6"
                        refX="8"
                        refY="3"
                        orient="auto"
                    >
                        <polygon points="0 0, 8 3, 0 6" fill="#f59e0b" />
                    </marker>
                    <marker
                        id="ah-green"
                        markerWidth="8"
                        markerHeight="6"
                        refX="8"
                        refY="3"
                        orient="auto"
                    >
                        <polygon points="0 0, 8 3, 0 6" fill="#22c55e" />
                    </marker>
                    <marker
                        id="ah-pink"
                        markerWidth="8"
                        markerHeight="6"
                        refX="8"
                        refY="3"
                        orient="auto"
                    >
                        <polygon points="0 0, 8 3, 0 6" fill="#ec4899" />
                    </marker>
                    <marker
                        id="ah-cyan"
                        markerWidth="8"
                        markerHeight="6"
                        refX="8"
                        refY="3"
                        orient="auto"
                    >
                        <polygon points="0 0, 8 3, 0 6" fill="#06b6d4" />
                    </marker>
                </defs>

                <!-- LAYER 1: DATA SOURCES -->
                <g class="node cat-api" data-id="api-status" data-flow="live">
                    <rect x="20" y="40" width="200" height="56" />
                    <text
                        class="label"
                        x="120"
                        y="62"
                        text-anchor="middle"
                        font-size="13"
                        font-weight="600"
                    >
                        get_campaign_status
                    </text>
                    <text x="120" y="80" text-anchor="middle" font-size="11" fill="#666">
                        Live war state + stats
                    </text>
                </g>

                <g class="node cat-api" data-id="api-snapshot" data-flow="snapshot">
                    <rect x="20" y="130" width="200" height="56" />
                    <text
                        class="label"
                        x="120"
                        y="152"
                        text-anchor="middle"
                        font-size="13"
                        font-weight="600"
                    >
                        get_snapshots
                    </text>
                    <text x="120" y="170" text-anchor="middle" font-size="11" fill="#666">
                        Historical time-series
                    </text>
                </g>

                <g class="node cat-seed" data-id="seed-files" data-flow="seed">
                    <rect x="20" y="260" width="200" height="56" />
                    <text
                        class="label"
                        x="120"
                        y="282"
                        text-anchor="middle"
                        font-size="13"
                        font-weight="600"
                    >
                        prisma/seed/seasons/*.json
                    </text>
                    <text x="120" y="300" text-anchor="middle" font-size="11" fill="#666">
                        Bootstrap (first deploy)
                    </text>
                </g>

                <g class="node cat-api" data-id="api-refresh" data-flow="refresh">
                    <rect x="20" y="350" width="200" height="56" />
                    <text
                        class="label"
                        x="120"
                        y="372"
                        text-anchor="middle"
                        font-size="13"
                        font-weight="600"
                    >
                        get_snapshots (forced)
                    </text>
                    <text x="120" y="390" text-anchor="middle" font-size="11" fill="#666">
                        Re-fetch any season
                    </text>
                </g>

                <!-- LAYER 2: PROCESSING -->
                <g class="node cat-worker" data-id="worker" data-flow="live snapshot">
                    <rect x="340" y="40" width="180" height="86" />
                    <text
                        class="label"
                        x="430"
                        y="62"
                        text-anchor="middle"
                        font-size="13"
                        font-weight="600"
                    >
                        Worker Thread
                    </text>
                    <text x="430" y="80" text-anchor="middle" font-size="11" fill="#888">
                        cron.js
                    </text>
                    <text x="430" y="98" text-anchor="middle" font-size="11" fill="#666">
                        setTimeout loop
                    </text>
                    <text x="430" y="114" text-anchor="middle" font-size="10" fill="#555">
                        poll &gt; validate &gt; upsert
                    </text>
                </g>

                <g class="node cat-seed" data-id="seed-script" data-flow="seed">
                    <rect x="340" y="260" width="180" height="56" />
                    <text
                        class="label"
                        x="430"
                        y="282"
                        text-anchor="middle"
                        font-size="13"
                        font-weight="600"
                    >
                        Seed Script
                    </text>
                    <text x="430" y="300" text-anchor="middle" font-size="11" fill="#666">
                        prisma db seed / startup
                    </text>
                </g>

                <g class="node cat-api" data-id="refresh-handler" data-flow="refresh">
                    <rect x="340" y="350" width="180" height="56" />
                    <text
                        class="label"
                        x="430"
                        y="372"
                        text-anchor="middle"
                        font-size="13"
                        font-weight="600"
                    >
                        updateSeason()
                    </text>
                    <text x="430" y="390" text-anchor="middle" font-size="11" fill="#666">
                        fetch + validate + upsert
                    </text>
                </g>

                <!-- LAYER 3: RAW CACHE -->
                <g class="node cat-raw" data-id="rb-status" data-flow="live">
                    <rect x="620" y="30" width="200" height="48" />
                    <text
                        class="label"
                        x="720"
                        y="52"
                        text-anchor="middle"
                        font-size="12"
                        font-weight="600"
                    >
                        rebroadcast_status
                    </text>
                    <text x="720" y="68" text-anchor="middle" font-size="10" fill="#666">
                        1 row/season - raw JSON
                    </text>
                </g>

                <g
                    class="node cat-raw"
                    data-id="rb-snapshot"
                    data-flow="snapshot refresh"
                >
                    <rect x="620" y="90" width="200" height="48" />
                    <text
                        class="label"
                        x="720"
                        y="112"
                        text-anchor="middle"
                        font-size="12"
                        font-weight="600"
                    >
                        rebroadcast_snapshot
                    </text>
                    <text x="720" y="128" text-anchor="middle" font-size="10" fill="#666">
                        1 row/season - raw JSON
                    </text>
                </g>

                <!-- LAYER 4: NORMALIZED DB -->
                <g
                    class="node cat-norm"
                    data-id="h1-season"
                    data-flow="live snapshot seed refresh"
                >
                    <rect x="620" y="170" width="200" height="40" />
                    <text
                        class="label"
                        x="720"
                        y="195"
                        text-anchor="middle"
                        font-size="12"
                        font-weight="600"
                    >
                        h1_season
                    </text>
                </g>

                <g
                    class="node cat-norm"
                    data-id="h1-live"
                    data-flow="live read-map read-stats"
                >
                    <rect x="620" y="222" width="200" height="48" />
                    <text
                        class="label"
                        x="720"
                        y="243"
                        text-anchor="middle"
                        font-size="12"
                        font-weight="600"
                    >
                        h1_live
                    </text>
                    <text x="720" y="260" text-anchor="middle" font-size="9" fill="#666">
                        campaigns + stats + map
                    </text>
                </g>

                <g
                    class="node cat-norm"
                    data-id="h1-event"
                    data-flow="live snapshot seed refresh read-events"
                >
                    <rect x="620" y="282" width="200" height="40" />
                    <text
                        class="label"
                        x="720"
                        y="307"
                        text-anchor="middle"
                        font-size="12"
                        font-weight="600"
                    >
                        h1_event
                    </text>
                </g>

                <g
                    class="node cat-norm"
                    data-id="h1-intro"
                    data-flow="live snapshot seed refresh"
                >
                    <rect x="620" y="334" width="200" height="40" />
                    <text
                        class="label"
                        x="720"
                        y="359"
                        text-anchor="middle"
                        font-size="12"
                        font-weight="600"
                    >
                        h1_introduction_order
                    </text>
                </g>

                <g
                    class="node cat-norm"
                    data-id="h1-points"
                    data-flow="live snapshot seed refresh"
                >
                    <rect x="620" y="386" width="200" height="40" />
                    <text
                        class="label"
                        x="720"
                        y="411"
                        text-anchor="middle"
                        font-size="12"
                        font-weight="600"
                    >
                        h1_points_max
                    </text>
                </g>

                <!-- LAYER 5: FRONTEND -->
                <g
                    class="node cat-frontend"
                    data-id="fe-live"
                    data-flow="read-map read-stats"
                >
                    <rect x="920" y="222" width="160" height="72" />
                    <text
                        class="label"
                        x="1000"
                        y="248"
                        text-anchor="middle"
                        font-size="12"
                        font-weight="600"
                    >
                        Live Dashboard
                    </text>
                    <text
                        x="1000"
                        y="266"
                        text-anchor="middle"
                        font-size="10"
                        fill="#666"
                    >
                        map + stats + players
                    </text>
                    <text x="1000" y="282" text-anchor="middle" font-size="9" fill="#555">
                        reads h1_live (3 rows)
                    </text>
                </g>

                <g class="node cat-frontend" data-id="fe-events" data-flow="read-events">
                    <rect x="920" y="310" width="160" height="52" />
                    <text
                        class="label"
                        x="1000"
                        y="332"
                        text-anchor="middle"
                        font-size="12"
                        font-weight="600"
                    >
                        Event Alerts
                    </text>
                    <text
                        x="1000"
                        y="350"
                        text-anchor="middle"
                        font-size="10"
                        fill="#666"
                    >
                        active defend/attack
                    </text>
                </g>

                <!-- Timeline component deferred to Phase 2 (requires h1_snapshot + time-series tables) -->

                <!-- ARROWS: API to Worker -->
                <path
                    class="arrow arrow-api"
                    data-flow="live"
                    d="M220,68 L340,68"
                    marker-end="url(#ah-blue)"
                />
                <path
                    class="arrow arrow-api"
                    data-flow="snapshot"
                    d="M220,158 L310,158 Q330,158 330,138 L330,100 Q330,83 340,83"
                    marker-end="url(#ah-blue)"
                />

                <!-- Seed to Seed Script -->
                <path
                    class="arrow arrow-seed"
                    data-flow="seed"
                    d="M220,288 L340,288"
                    marker-end="url(#ah-pink)"
                />

                <!-- Force Refresh arrows -->
                <path
                    class="arrow arrow-api"
                    data-flow="refresh"
                    d="M220,378 L340,378"
                    marker-end="url(#ah-blue)"
                />

                <rect class="annotation-bg" x="235" y="368" width="72" height="16" />
                <text
                    class="annotation"
                    x="271"
                    y="379"
                    text-anchor="middle"
                    data-flow="refresh"
                >
                    on demand
                </text>

                <!-- Worker to Raw Cache -->
                <path
                    class="arrow arrow-amber"
                    data-flow="live"
                    d="M520,60 L620,54"
                    marker-end="url(#ah-amber)"
                />
                <path
                    class="arrow arrow-amber"
                    data-flow="snapshot"
                    d="M520,80 L580,80 Q600,80 600,100 L600,114 L620,114"
                    marker-end="url(#ah-amber)"
                />

                <!-- Worker to Normalized: h1_season, h1_live, h1_event, h1_intro, h1_points -->
                <path
                    class="arrow arrow-green"
                    data-flow="live"
                    d="M520,70 L570,70 Q590,70 590,170 L590,190 L620,190"
                    marker-end="url(#ah-green)"
                />
                <path
                    class="arrow arrow-green"
                    data-flow="live"
                    d="M520,75 L565,75 Q585,75 585,200 L585,246 L620,246"
                    marker-end="url(#ah-green)"
                />
                <path
                    class="arrow arrow-green"
                    data-flow="live"
                    d="M520,80 L560,80 Q580,80 580,240 L580,302 L620,302"
                    marker-end="url(#ah-green)"
                />
                <path
                    class="arrow arrow-green"
                    data-flow="live"
                    d="M520,85 L555,85 Q575,85 575,280 L575,354 L620,354"
                    marker-end="url(#ah-green)"
                />
                <path
                    class="arrow arrow-green"
                    data-flow="live"
                    d="M520,90 L550,90 Q570,90 570,320 L570,406 L620,406"
                    marker-end="url(#ah-green)"
                />

                <!-- Snapshot sync to Normalized (events + intro_order + points_max) -->
                <path
                    class="arrow arrow-green"
                    data-flow="snapshot"
                    d="M520,90 L560,90 Q575,90 575,240 L575,302 L620,302"
                    marker-end="url(#ah-green)"
                />
                <path
                    class="arrow arrow-green"
                    data-flow="snapshot"
                    d="M520,95 L555,95 Q570,95 570,300 L570,354 L620,354"
                    marker-end="url(#ah-green)"
                />
                <path
                    class="arrow arrow-green"
                    data-flow="snapshot"
                    d="M520,100 L550,100 Q565,100 565,340 L565,406 L620,406"
                    marker-end="url(#ah-green)"
                />

                <!-- Seed Script to Normalized: h1_season, h1_event, h1_intro, h1_points (NOT h1_live) -->
                <path
                    class="arrow arrow-seed"
                    data-flow="seed"
                    d="M520,275 L570,275 Q590,275 590,200 L590,190 L620,190"
                    marker-end="url(#ah-pink)"
                />
                <path
                    class="arrow arrow-seed arrow-dashed"
                    data-flow="seed"
                    d="M520,280 L565,280 Q580,280 580,302 L620,302"
                    marker-end="url(#ah-pink)"
                />
                <path
                    class="arrow arrow-seed arrow-dashed"
                    data-flow="seed"
                    d="M520,285 L560,285 Q575,285 575,340 L575,354 L620,354"
                    marker-end="url(#ah-pink)"
                />
                <path
                    class="arrow arrow-seed arrow-dashed"
                    data-flow="seed"
                    d="M520,290 L555,290 Q570,290 570,380 L570,406 L620,406"
                    marker-end="url(#ah-pink)"
                />

                <!-- Refresh handler to Raw Cache + Normalized -->
                <path
                    class="arrow arrow-amber"
                    data-flow="refresh"
                    d="M520,365 L580,365 Q600,365 600,140 L600,114 L620,114"
                    marker-end="url(#ah-amber)"
                />
                <path
                    class="arrow arrow-green"
                    data-flow="refresh"
                    d="M520,370 L570,370 Q585,370 585,200 L585,190 L620,190"
                    marker-end="url(#ah-green)"
                />
                <path
                    class="arrow arrow-green"
                    data-flow="refresh"
                    d="M520,375 L565,375 Q580,375 580,302 L620,302"
                    marker-end="url(#ah-green)"
                />
                <path
                    class="arrow arrow-green"
                    data-flow="refresh"
                    d="M520,380 L560,380 Q575,375 575,354 L620,354"
                    marker-end="url(#ah-green)"
                />
                <path
                    class="arrow arrow-green"
                    data-flow="refresh"
                    d="M520,385 L555,385 Q570,385 570,406 L620,406"
                    marker-end="url(#ah-green)"
                />

                <!-- DB to Frontend -->
                <path
                    class="arrow arrow-frontend"
                    data-flow="read-map read-stats"

            function buildDetailDOM(data) {
                const container = document.getElementById('detailContent');
                while (container.firstChild) container.removeChild(container.firstChild);

                const h2 = document.createElement('h2');
                h2.textContent = data.title;
                container.appendChild(h2);

                const sub = document.createElement('div');
                sub.className = 'subtitle';
                sub.textContent = data.subtitle;
                container.appendChild(sub);

                for (const section of data.sections) {
                    if (section.type === 'text') {
                        const p = document.createElement('p');
                        p.textContent = section.content;
                        container.appendChild(p);
                    } else if (section.type === 'heading') {
                        const h4 = document.createElement('h4');
                        h4.style.cssText = 'color:#888;margin-top:16px;font-size:12px';
                        h4.textContent = section.content;
                        container.appendChild(h4);
                    } else if (section.type === 'code') {
                        const pre = document.createElement('pre');
                        pre.textContent = section.content;
                        container.appendChild(pre);
                    } else if (section.type === 'tags') {
                        const div = document.createElement('div');
                        for (const tag of section.items) {
                            const span = document.createElement('span');
                            span.className = 'tag ' + tag.cls;
                            span.textContent = tag.text;
                            div.appendChild(span);
                        }
                        container.appendChild(div);
                    } else if (section.type === 'table') {
                        const table = document.createElement('table');
                        table.className = 'schema-table';
                        const thead = document.createElement('thead');
                        const headerRow = document.createElement('tr');
                        for (const h of section.headers) {
                            const th = document.createElement('th');
                            th.textContent = h;
                            headerRow.appendChild(th);
                        }
                        thead.appendChild(headerRow);
                        table.appendChild(thead);
                        const tbody = document.createElement('tbody');
                        for (const row of section.rows) {
                            const tr = document.createElement('tr');
                            for (const cell of row) {
                                const td = document.createElement('td');
                                td.textContent = cell;
                                tr.appendChild(td);
                            }
                            tbody.appendChild(tr);
                        }
                        table.appendChild(tbody);
                        container.appendChild(table);
                    }
                }
            }

            function openDetail(id) {
                if (detailData[id]) {
                    buildDetailDOM(detailData[id]);
                    document.getElementById('detailPanel').classList.add('open');
                }
            }

            function closeDetail() {
                document.getElementById('detailPanel').classList.remove('open');
            }

            document.getElementById('detailClose').addEventListener('click', closeDetail);

            // View filtering
            const buttons = document.querySelectorAll('.controls button');
            const allElements = document.querySelectorAll('[data-flow]');

            buttons.forEach(function (btn) {
                btn.addEventListener('click', function () {
                    buttons.forEach(function (b) {
                        b.classList.remove('active');
                    });
                    btn.classList.add('active');
                    var view = btn.dataset.view;

                    if (view === 'all') {
                        allElements.forEach(function (el) {
                            el.classList.remove('dimmed', 'highlighted');
                        });
                        return;
                    }

                    var flowMap = {
                        live: ['live'],
                        snapshot: ['snapshot'],
                        seed: ['seed'],
                        refresh: ['refresh'],
                        read: ['read-map', 'read-stats', 'read-events'],
                    };

                    var activeFlows = flowMap[view] || [view];

                    allElements.forEach(function (el) {
                        var flows = (el.dataset.flow || '').split(' ');
                        var matches = flows.some(function (f) {
                            return activeFlows.indexOf(f) !== -1;
                        });
                        if (matches) {
                            el.classList.remove('dimmed');
                            el.classList.add('highlighted');
                        } else {
                            el.classList.remove('highlighted');
                            el.classList.add('dimmed');
                        }
                    });
                });
            });

            // Click nodes to show detail
            document.querySelectorAll('.node').forEach(function (node) {
                node.style.cursor = 'pointer';
                node.addEventListener('click', function (e) {
                    e.stopPropagation();
                    openDetail(node.dataset.id);
                });
            });

            document.addEventListener('click', function (e) {
                if (!e.target.closest('.detail-panel') && !e.target.closest('.node')) {
                    closeDetail();
                }
            });

            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') closeDetail();
            });
